[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopassist"
version = "0.1.0"
description = "Conversational Product Recommendation System using LLM-based Query Understanding and Hybrid Retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "google-genai>=2.0.0",
    "groq>=0.11.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=.deps/pytest_tmp"
markers = [
    "integration: marks integration tests that load neural model weights",
    "live_api: marks live integration tests that require external API access",
]
